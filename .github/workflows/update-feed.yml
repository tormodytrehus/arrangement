name: Oppdater arrangementsfeed

on:
  schedule:
    # 08.00 norsk sommertid
    - cron: "0 6 * * 1-5"

    # 08.00 norsk vintertid
    - cron: "0 7 * * 1-5"

  workflow_dispatch:
    inputs:
      mode:
        description: Hvilket varsel skal lages?
        required: true
        default: daily
        type: choice
        options:
          - daily
          - friday

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: arrangement-rss-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Bestem om jobben skal kjøre
        id: plan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mode=$MODE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OFFSET="$(TZ=Europe/Oslo date +%z)"

          if [ "$OFFSET" = "+0200" ]; then
            EXPECTED_SCHEDULE="0 6 * * 1-5"
          else
            EXPECTED_SCHEDULE="0 7 * * 1-5"
          fi

          if [ "${{ github.event.schedule }}" != "$EXPECTED_SCHEDULE" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          WEEKDAY="$(TZ=Europe/Oslo date +%u)"

          if [ "$WEEKDAY" = "5" ]; then
            MODE="friday"
          else
            MODE="daily"
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Hent repository
        if: steps.plan.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Sett opp Python
        if: steps.plan.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kontroller Python-koden
        if: steps.plan.outputs.run == 'true'
        run: python -m py_compile src/event_feed.py

      - name: Lag RSS-varsel
        if: steps.plan.outputs.run == 'true'
        env:
          FEED_URL: https://tormodytrehus.github.io/arrangement-rss/feed.xml
        run: |
          python src/event_feed.py \
            --mode "${{ steps.plan.outputs.mode }}" \
            --output docs/feed.xml \
            --history docs/history.json

      - name: Lagre oppdatert feed
        if: steps.plan.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml docs/history.json

          if git diff --cached --quiet; then
            echo "Ingen endringer å lagre"
          else
            git commit -m "Oppdater arrangementsfeed"
            git push
          fi

      - name: Klargjør GitHub Pages
        if: steps.plan.outputs.run == 'true'
        uses: actions/configure-pages@v5

      - name: Last opp GitHub Pages
        if: steps.plan.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publiser GitHub Pages
        if: steps.plan.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
